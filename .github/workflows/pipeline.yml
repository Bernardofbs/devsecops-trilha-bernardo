
name: Security Pipeline - SAST Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep-sast:
    name: Build e Análise SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        working-directory: app/devsecops-app-student/app-student
        run: npm ci

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-app:ci \
            app/devsecops-app-student/app-student

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan \
            --config auto \
            --config p/dockerfile \
            --error \
            app/devsecops-app-student/app-student
